name = "job-tracker"
main = "src/worker.js"
compatibility_date = "2026-07-15"
workers_dev = false

[[kv_namespaces]]
binding = "KV"
id = "8cf95c7c04054745bff09d88ea57d707"

[[d1_databases]]
binding = "DB"
database_name = "job-tracker-app-db"
database_id = "d0b81077-9b5d-425a-a821-979375f63e89"

[triggers]
crons = ["0 3 * * *", "10 3 * * *", "20 3 * * *", "30 3 * * *", "40 3 * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[observability]
enabled = true
