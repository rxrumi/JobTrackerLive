name: Production Deployment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy tested master commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    concurrency:
      group: production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://livejobindex.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Confirm the tested commit is still master
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)" = "$TESTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply production migrations
        run: npx wrangler d1 migrations apply job-tracker-app-db --remote
      - name: Deploy Workflow Worker
        run: npx wrangler deploy -c workflow/wrangler.toml
      - name: Deploy main Worker
        run: npx wrangler deploy
