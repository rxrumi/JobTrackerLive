name = "job-tracker"
main = "src/worker.js"
compatibility_date = "2026-06-04"
workers_dev = false

[[kv_namespaces]]
binding = "KV"
id = "8cf95c7c04054745bff09d88ea57d707"

[triggers]
crons = ["0 3 * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true

# Required secrets (set via `npx wrangler secret put <name>`):
# - SUPABASE_URL              (e.g. https://<ref>.supabase.co)
# - SUPABASE_PUBLISHABLE_KEY  (public anon key for auth / user-facing queries)
# - SUPABASE_SERVICE_ROLE_KEY (service role key for scan persistence & tracking writes)
# - SCAN_KEY                  (secret for manual scan trigger via /api/scan-now)
# - TURNSTILE_SECRET          (Cloudflare Turnstile server-side secret)
# - TURNSTILE_SITE_KEY        (Cloudflare Turnstile site key, exposed to frontend)
# - PAGE_ACCESS_SECRET        (HMAC secret for page-access clearance cookies)
# - ANALYTICS_ALLOWED_EMAILS  (comma-separated owner emails allowed to read global analytics)

[[routes]]
pattern = "livejobindex.com"
custom_domain = true
zone_name = "livejobindex.com"

[[routes]]
pattern = "www.livejobindex.com"
custom_domain = true
zone_name = "livejobindex.com"
